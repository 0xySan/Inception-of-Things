# values-minikube.yaml (Adapted for GitLab 10.x)

global:
  ingress:
    configureCertmanager: false
    # No explicit class: use the cluster default (Traefik on k3s/k3d)
  hosts:
    # The GitLab chart adds the "gitlab" subdomain automatically.
    # Using gitlab.localhost here would therefore generate
    # gitlab.gitlab.localhost.
    domain: localhost
    externalIP: 0.0.0.0
    https: false

  # v10 routes through Gateway API (Envoy) by default: revert to classic Ingress
  gatewayApi:
    enabled: false
    installEnvoy: false
    configureCertmanager: false

  # Configuration for connecting to external PostgreSQL
  psql:
    host: gitlab-postgresql.gitlab.svc.cluster.local # Kubernetes service name
    port: 5432
    username: postgres
    database: gitlabhq_production
    password:
      secret: gitlab-postgresql-password # This Kubernetes secret is created by the installation script
      key: postgresql-password

  # Configuration for connecting to external Redis
  redis:
    host: gitlab-redis-master.gitlab.svc.cluster.local # Kubernetes service name
    port: 6379
    password:
      secret: gitlab-redis-password # This Kubernetes secret is created by the installation script
      key: redis-password

  # No object storage backend in this setup: disable every storage-backed feature
  appConfig:
    artifacts:
      enabled: false
    lfs:
      enabled: false
    uploads:
      enabled: false
    packages:
      enabled: false

# Explicitly disable bundled components (required for v10+)
postgresql:
  install: false
redis:
  install: false
minio:
  install: false

# v10+ ships no object storage for the registry: disable it entirely
registry:
  enabled: false

certmanager-issuer:
  email: admin@gitlab.localhost

# Remaining minimal configuration
installCertmanager: false
nginx-ingress:
  enabled: false
prometheus:
  install: false
gitlab-runner:
  install: false
gitlab:
  # Toolbox (rake tasks/backup runner) renders broken specs without object storage
  toolbox:
    enabled: false
    replicas: 0
  webservice:
    minReplicas: 1
    maxReplicas: 1
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
    service:
      type: NodePort
      nodePort: 32022
