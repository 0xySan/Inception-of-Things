# values-minikube.yaml (Adapted for GitLab 10.x)

global:
  ingress:
    configureCertmanager: false
    class: "nginx" # Note: Nginx is no longer the default in v10; Envoy is preferred, but Minikube often uses the Nginx addon.
  hosts:
    domain: gitlab.localhost
    externalIP: 0.0.0.0
    https: false

  # Configuration for connecting to external PostgreSQL
  psql:
    host: gitlab-postgresql.gitlab.svc.cluster.local # Kubernetes service name
    port: 5432
    username: postgres
    database: gitlabhq_production
    password:
      secret: gitlab-postgresql-password # This Kubernetes secret is created by the installation script
      key: postgresql-password

  # Configuration for connecting to external Redis
  redis:
    host: gitlab-redis-master.gitlab.svc.cluster.local # Kubernetes service name
    port: 6379
    password:
      secret: gitlab-redis-password # This Kubernetes secret is created by the installation script
      key: redis-password

  # Object storage configuration (required for many features)
  # If you install external MinIO through bitnami/minio:
  appConfig:
    object_store:
      enabled: true
      connection:
        secret: gitlab-minio-secret # This secret is created with the S3 connection details
        key: connection

# Explicitly disable bundled components (required for v10+)
postgresql:
  install: false
redis:
  install: false
minio:
  install: false

# Remaining minimal configuration
installCertmanager: false
nginx-ingress:
  enabled: false
prometheus:
  install: false
gitlab-runner:
  install: false
gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
  gitlab-shell:
    minReplicas: 1
    maxReplicas: 1
    service:
      type: NodePort
      nodePort: 32022